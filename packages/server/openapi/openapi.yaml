openapi: 3.1.0
info:
  title: Zox Server API
  version: 0.0.0
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /sessions:
    get:
      summary: List sessions for a workspace
      parameters:
        - name: workspaceRoot
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "400":
          description: workspaceRoot missing
    post:
      summary: Create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /sessions/{id}:
    get:
      summary: Session metadata + status
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
  /sessions/{id}/messages:
    post:
      summary: Send user message (starts turn)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: Turn accepted
        "409":
          description: Session not idle
  /sessions/{id}/events:
    get:
      summary: SSE event stream
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: text/event-stream of ZoxEvent
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ZoxEvent"
  /sessions/{id}/ws:
    get:
      summary: WebSocket for session events and permission.response
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Alternative to Authorization Bearer for browsers
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "426":
          description: Upgrade required (HTTP without WebSocket handshake)
  /sessions/{id}/cancel:
    post:
      summary: Cancel in-flight turn
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Cancelled
  /sessions/{id}/permissions/{requestId}:
    post:
      summary: Approve or deny a tool or prompt permission request
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
      responses:
        "200":
          description: Decision recorded
  /sessions/{id}/compact:
    post:
      summary: Manual compact
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Compacted
  /sessions/{id}/revert:
    post:
      summary: Restore a file snapshot for the session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshotId:
                  type: string
      responses:
        "200":
          description: Restored path and snapshot id
          content:
            application/json:
              schema:
                type: object
                required: [path, snapshotId]
                properties:
                  path:
                    type: string
                  snapshotId:
                    type: string
        "404":
          description: Session or snapshot not found
  /sessions/{id}/export:
    get:
      summary: Redacted session transcript JSON
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: includeMemory
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include durable memory strings (redacted). Default false.
      responses:
        "200":
          description: Session export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExport"
        "404":
          description: Not found
  /sessions/{id}/commands:
    post:
      summary: Slash-command equivalents except /exit
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                args:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Command result
  /sessions/{id}/close:
    post:
      summary: SessionEnd hooks and auto-summarize
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Closed
  /sessions/{id}/memory:
    get:
      summary: Plan, prior-state, active skills, and injected durable ids
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Memory snapshot
    post:
      summary: Append a durable memory entry
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                pinned:
                  type: boolean
      responses:
        "201":
          description: Created
  /memory/search:
    get:
      summary: FTS search durable memories
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: workspaceRoot
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ranked memories
  /models:
    get:
      summary: List adapters and sample model ids
      responses:
        "200":
          description: OK
  /usage:
    get:
      summary: Session or process usage totals
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
  /config:
    get:
      summary: Redacted effective config
      responses:
        "200":
          description: OK
    put:
      summary: Merge non-secret config fields
      responses:
        "200":
          description: OK
  /mcp/servers:
    post:
      summary: Register MCP server
      responses:
        "201":
          description: Created
  /mcp/servers/{name}:
    delete:
      summary: Remove MCP server
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: text/plain prometheus
        "404":
          description: Metrics disabled
  /hooks:
    get:
      summary: Effective hooks with command paths only
      responses:
        "200":
          description: OK
  /sessions/{id}/hooks/test:
    post:
      summary: Dry-run a hook event with a fixture payload
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, payload]
              properties:
                event:
                  type: string
                payload: {}
      responses:
        "200":
          description: HookOutput
        "404":
          description: Unknown session
  /skills:
    get:
      summary: Workspace-scoped skill catalog
      parameters:
        - name: workspaceRoot
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catalog
  /sessions/{id}/skills:
    get:
      summary: Session catalog + active skills
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
    post:
      summary: Load or unload a skill on the session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, name]
              properties:
                action:
                  type: string
                  enum: [load, unload]
                name:
                  type: string
      responses:
        "200":
          description: Updated session skills
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (Authorization header)
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateSessionRequest:
      type: object
      required: [workspaceRoot]
      properties:
        workspaceRoot:
          type: string
        agent:
          type: string
          default: build
        model:
          type: string
          default: mock/echo
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
    Session:
      type: object
      required: [id, workspaceRoot, agent, model, status]
      properties:
        id:
          type: string
        workspaceRoot:
          type: string
        agent:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [idle, running, compacting, awaiting_permission, error]
    SessionSummary:
      type: object
      required: [id, workspaceRoot, agent, model, status, createdAt]
      properties:
        id:
          type: string
        workspaceRoot:
          type: string
        agent:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [idle, running, compacting, awaiting_permission, error]
        createdAt:
          type: number
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
    SessionExport:
      type: object
      required: [version, session, messages, usage]
      properties:
        version:
          type: integer
          enum: [1]
        session:
          type: object
          required: [id, agent, model, status]
          properties:
            id:
              type: string
            agent:
              type: string
            model:
              type: string
            status:
              type: string
              enum: [idle, running, compacting, awaiting_permission, error]
            createdAt:
              type: number
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
              content:
                type: string
              name:
                type: string
        usage:
          type: object
          required: [inputTokens, outputTokens]
          properties:
            inputTokens:
              type: number
            outputTokens:
              type: number
        memory:
          type: array
          items:
            type: string
    ZoxEvent:
      description: Session event streamed over SSE and WebSocket
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - session.status
            - message.delta
            - message.completed
            - tool.started
            - tool.completed
            - tool.permission_required
            - usage.turn
            - usage.session
            - context.estimated
            - context.overflow
            - context.compacted
            - error
            - skills.changed
            - budget.exceeded
            - prompt.guardrail
            - prompt.blocked
            - prompt.permission_required
        sessionId:
          type: string
        outcome:
          type: string
          enum: [allow, deny, ask, skipped]
        question:
          type: string
          enum: [injection, policy_violation]
        pYes:
          type: number
        confidence:
          type: number
        reason:
          type: string
        requestId:
          type: string

