openapi: 3.1.0
info:
  title: Zox Server API
  version: 0.0.0
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /sessions:
    post:
      summary: Create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /sessions/{id}:
    get:
      summary: Session metadata + status
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Not found
  /sessions/{id}/messages:
    post:
      summary: Send user message (starts turn)
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: Turn accepted
        "409":
          description: Session not idle
  /sessions/{id}/events:
    get:
      summary: SSE event stream
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: text/event-stream of ZoxEvent
          content:
            text/event-stream:
              schema:
                type: string
  /sessions/{id}/cancel:
    post:
      summary: Cancel in-flight turn
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Cancelled
  /sessions/{id}/permissions/{requestId}:
    post:
      summary: Approve or deny a tool permission request
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved:
                  type: boolean
      responses:
        "200":
          description: Decision recorded
  /sessions/{id}/compact:
    post:
      summary: Manual compact
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Compacted
  /sessions/{id}/commands:
    post:
      summary: Slash-command equivalents except /exit
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                args:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Command result
  /sessions/{id}/close:
    post:
      summary: SessionEnd hooks and auto-summarize
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Closed
  /sessions/{id}/memory:
    get:
      summary: Plan, prior-state, and active skills
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Memory snapshot
  /models:
    get:
      summary: List adapters and sample model ids
      responses:
        "200":
          description: OK
  /usage:
    get:
      summary: Session or process usage totals
      parameters:
        - name: sessionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
  /config:
    get:
      summary: Redacted effective config
      responses:
        "200":
          description: OK
    put:
      summary: Merge non-secret config fields
      responses:
        "200":
          description: OK
  /mcp/servers:
    post:
      summary: Register MCP server
      responses:
        "201":
          description: Created
  /mcp/servers/{name}:
    delete:
      summary: Remove MCP server
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: text/plain prometheus
        "404":
          description: Metrics disabled
  /hooks:
    get:
      summary: Effective hooks with command paths only
      responses:
        "200":
          description: OK
  /skills:
    get:
      summary: Workspace-scoped skill catalog
      parameters:
        - name: workspaceRoot
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catalog
  /sessions/{id}/skills:
    get:
      summary: Session catalog + active skills
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: OK
    post:
      summary: Load or unload a skill on the session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, name]
              properties:
                action:
                  type: string
                  enum: [load, unload]
                name:
                  type: string
      responses:
        "200":
          description: Updated session skills
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (Authorization header)
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    CreateSessionRequest:
      type: object
      required: [workspaceRoot]
      properties:
        workspaceRoot:
          type: string
        agent:
          type: string
          default: build
        model:
          type: string
          default: mock/echo
    SendMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
    Session:
      type: object
      required: [id, workspaceRoot, agent, model, status]
      properties:
        id:
          type: string
        workspaceRoot:
          type: string
        agent:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [idle, running, compacting, awaiting_permission, error]
