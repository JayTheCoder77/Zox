<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Alternative: terminal prompt style -->
  <rect width="32" height="32" rx="6" fill="#201d1d"/>
  <!-- prompt caret > -->
  <path
    stroke="#fdfcfc"
    stroke-width="2.2"
    stroke-linecap="square"
    stroke-linejoin="miter"
    d="M9 11l6 5-6 5"
  />
  <!-- underscore cursor -->
  <rect x="17" y="20" width="7" height="2.2" fill="#fdfcfc"/>
</svg>
